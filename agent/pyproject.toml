[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant-agent"
version = "0.1.0"
description = "Voice assistant LiveKit agent using vLLM-Omni with Qwen3-Omni"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[mcp]~=1.5",
    "mcp>=1.24",
    "livekit-plugins-silero~=1.5",
    "livekit-plugins-openai~=1.5",
    "openai",
    "httpx",
    "python-dotenv",
    # Transport for _vllm_omni_duplex_client.py (vendored from vllm-omni's
    # own duplex client, used by Nemotron VoiceChat's full-duplex mode).
    "websockets>=12",
]

[tool.setuptools.packages.find]
where = ["src"]
